org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Project uses plain framework Views (no androidx), so androidx dependency
# resolution is disabled explicitly to keep the dependency graph empty.
android.useAndroidx=false
# Use the aapt2 binary already installed with the local Android SDK instead of
# downloading the Maven artifact (documented AGP override; see
# IMPLEMENTATION_REPORT.md). This is the ONLY machine-specific line in this
# file and it is kept intentionally: the aapt2 Maven artifact cannot be
# downloaded on this network (~12-15 KB/s to dl.google.com). On another
# machine, either adjust the path to the local SDK's build-tools aapt2 or
# delete this line to use the Maven artifact.
android.aapt2FromMavenOverride=/Users/m.mac/Library/Android/sdk/build-tools/36.0.0/aapt2
# Slow network on this machine: allow long-running artifact downloads.
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=120000
